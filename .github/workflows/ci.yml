name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  daemon:
    name: Build and test daemon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config libglib2.0-dev libbluetooth-dev

      - name: Build
        run: |
          meson setup daemon/build daemon
          ninja -C daemon/build

      - name: Test
        run: meson test -C daemon/build --print-errorlogs

      # Memory errors in timers and D-Bus callbacks don't always crash:
      # catch them before a release does
      - name: Test with sanitizers
        run: |
          meson setup daemon/build-asan daemon -Db_sanitize=address,undefined
          ninja -C daemon/build-asan
          ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            meson test -C daemon/build-asan --print-errorlogs
